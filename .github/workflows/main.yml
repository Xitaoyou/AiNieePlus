# .github/workflows/your-workflow-name.yml

name: AiNieePlus Windows x64 Installer
on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: Also build macOS packages
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Windows x86-64 installer and portable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install UPX
        shell: cmd
        run: |
          choco install upx -y

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-frontend.txt
            requirements-backend.txt
            requirements_no_deps.txt

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-frontend.txt -r requirements-backend.txt "pyinstaller>=6.21.0" pytest
          python -m pip install --no-deps -r requirements_no_deps.txt

      - name: Repair onnxruntime wheel
        # pip 的 wheel 缓存/镜像层偶尔留下损坏的 onnxruntime DLL，
        # 无缓存重装可保证 _pybind_state 可加载。
        run: |
          python -m pip uninstall -y onnxruntime
          python -m pip install --no-cache-dir "onnxruntime==1.26.0"

      - name: Cache offline manga resources
        uses: actions/cache@v4
        with:
          path: |
            Backend/resources/manga/models
            Backend/resources/manga/fonts
          key: manga-core-${{ hashFiles('Backend/resources/manga/source-lock.json') }}

      - name: Stamp AiNieePlus release version
        run: python Tools/stamp_fork_version.py

      - name: Prepare offline manga models and fonts
        run: python -m Tools.prepare_manga_models --download

      - name: Verify manga backend workflows
        run: python Tools/run_manga_tests.py tests --ignore=tests/test_manga_editor.py -q

      - name: Verify manga Fluent editor
        env:
          QT_QPA_PLATFORM: offscreen
        run: python Tools/run_manga_tests.py tests/test_manga_editor.py -q

      - name: Cache bundled FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/media-tools/windows-x86_64
          key: ffmpeg-windows-x86_64-${{ hashFiles('Tools/ffmpeg-source.json', 'Tools/prepare_ffmpeg.py', 'Tools/scripts/build_ffmpeg.sh') }}

      - name: Prepare verified FFmpeg source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: python Tools/prepare_ffmpeg.py

      - name: Install FFmpeg build toolchain
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make diffutils mingw-w64-x86_64-gcc

      - name: Build bundled FFmpeg and ffprobe
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash Tools/scripts/build_ffmpeg.sh windows x86_64

      - name: Verify media tools without system PATH
        run: python Tools/ffmpeg_bundle.py

      - name: Save verified FFmpeg before packaging
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/media-tools/windows-x86_64
          key: ffmpeg-windows-x86_64-${{ hashFiles('Tools/ffmpeg-source.json', 'Tools/prepare_ffmpeg.py', 'Tools/scripts/build_ffmpeg.sh') }}

      - name: Set up Rust updater toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build EXE with PyInstaller (--onedir mode)
        # 将原 Build EXE 步骤重命名，更清晰
        run: python .\Tools\pyinstall.py

      - name: Build x64 Windows installer
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/AiNiee/LICENSE
          New-Item -ItemType Directory -Path dist/AiNiee/docs -Force | Out-Null
          Copy-Item docs/manga.md dist/AiNiee/docs/manga.md
          Copy-Item docs/images dist/AiNiee/docs/images -Recurse
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          $sourceRoot = (Resolve-Path dist/AiNiee).Path
          $outputRoot = Join-Path $PWD 'dist/installer'
          & $compiler "/DAppVersion=$env:GITHUB_RUN_NUMBER.0" "/DSourceRoot=$sourceRoot" "/DOutputRoot=$outputRoot" Tools/Packaging/windows/AiNieePlus.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Verify installed x64 package
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist/installer/AiNieePlus-Windows-x64-Setup.exe).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'AiNieePlus Installed Test'
          $result = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installDir`"") -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer test failed: $($result.ExitCode)" }
          python -m Tools.verify_windows_release "$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Installed package verification failed" }

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: AiNieePlus-Windows-x64-Setup
          path: dist/installer/AiNieePlus-Windows-x64-Setup.exe
          if-no-files-found: error

      - name: Prepare Release Package
        run: |
          # 前端和后端使用两个独立可执行程序，完整打入同一发布目录。
          Set-Content -Path "dist\AiNiee\portable.txt" -Value "便携模式：删除此文件可改用系统目录。"
          Compress-Archive -Path "dist\AiNiee" -DestinationPath "AiNiee-Beta-Windows-Portable.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AiNiee-Beta-Windows-Portable
          path: AiNiee-Beta-Windows-Portable.zip

  build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      # 分别在 Apple Silicon 和 Intel runner 上构建，避免跨架构产物混用。
      matrix:
        include:
          - arch: arm64
            runs_on: macos-15
          - arch: x86_64
            runs_on: macos-15-intel
    runs-on: ${{ matrix.runs_on }}
    env:
      AINIEE_MACOS_ARCH: ${{ matrix.arch }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache bundled FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/media-tools/macos-${{ matrix.arch }}
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('Tools/ffmpeg-source.json', 'Tools/prepare_ffmpeg.py', 'Tools/scripts/build_ffmpeg.sh') }}

      - name: Build bundled FFmpeg and ffprobe
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          python Tools/prepare_ffmpeg.py
          bash Tools/scripts/build_ffmpeg.sh macos "$AINIEE_MACOS_ARCH"

      - name: Verify media tools without system PATH
        run: python Tools/ffmpeg_bundle.py --target-arch "$AINIEE_MACOS_ARCH"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-frontend.txt -r requirements-backend.txt "pyinstaller>=6.21.0"
          python -m pip install --no-deps -r requirements_no_deps.txt
          python -m pip cache purge

      - name: Stamp AiNieePlus release version
        run: python Tools/stamp_fork_version.py

      - name: Prepare offline manga models and fonts
        run: python -m Tools.prepare_manga_models --download

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          echo "$MACOS_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" build.keychain

      - name: Build app bundle
        run: python Tools/pyinstall_macos.py --target-arch "$AINIEE_MACOS_ARCH"

      - name: Package DMG
        run: |
          if [[ -n "$CODESIGN_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            bash Tools/scripts/notarize_macos.sh
          else
            bash Tools/scripts/package_dmg.sh
          fi

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: AiNiee-Beta-macOS-${{ matrix.arch }}
          path: dist/AiNiee-Beta-macOS-${{ matrix.arch }}.dmg

  release:
    name: Publish tested release assets
    if: always() && needs.build.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    needs:
      - build
      - build-macos
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish versioned release
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets downloaded"; exit 1
          fi

          tag="manga-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          sha256sum "${assets[@]}" > release-assets/SHA256SUMS.txt
          gh release create "$tag" "${assets[@]}" release-assets/SHA256SUMS.txt \
            --title "AiNieePlus 漫画翻译 ${GITHUB_RUN_NUMBER} · Windows x64" \
            --notes "$(cat <<'NOTES'
          正式版：本地漫画识别、编辑排版、完整离线核心模型与 Windows x86-64 安装程序。

          - 检测：面板模型只输出整页面板框时，自动用行级模型补齐文字框
          - 模型中心：44 个检测/OCR 模型，悬停查看功能介绍与影响，大小列可拉宽
          - 云 OCR：OCR.space 等免费通道无需配置即可直接使用
          - 编辑器：中键拖动画面带光标反馈，拖动时不再弹出提示浮层
          - 状态栏提示按类型合并计数，不再逐页刷屏

          下载 Portable 压缩包解压即用，或使用安装程序。
          NOTES
          )" \
            --target "$GITHUB_SHA"
